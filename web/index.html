<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<title>Desktop Dashboard</title>
<script src="vendor/tailwind.js"></script>
<style type="text/tailwindcss">
  @theme {
    --font-sans: "Fira Sans", system-ui, sans-serif;
    --font-mono: "Fira Mono", ui-monospace, monospace;
    --color-ink:      oklch(0.96 0.01 250);
    --color-muted:    oklch(0.70 0.03 255);
    --color-faint:    oklch(0.52 0.03 258);
    --color-panel:    oklch(0.19 0.015 260 / 0.88);
    --color-hairline: oklch(0.70 0.04 260 / 0.14);
    /* Cyberpunk UIKit accent triad (ui/cyberpunk/CyberpunkUIKit) -- exact
       hex values from the template so the two stay in visual sync. */
    --color-accent:        #2be4ea;  /* cyan   */
    --color-warm:          #fed33f;  /* amber  */
    --color-crimson:       #e8615a;
    --color-cyan-border:   #1f6a6e;
    --color-amber-border:  #8a6a12;
    --color-crimson-border:#9c3230;
    --color-online:        #2bfea0;
  }
</style>
<style>
  /* Tailwind's browser JIT only emits an @theme token onto :root when its
     scanner sees the token's name inside an HTML class attribute (a plain
     utility like `text-warm`, or the var() spelled out in `[...]`
     arbitrary-value syntax) -- never for a var() reference buried in this
     <style> tag or in app.js. --color-warm used to be emitted only because
     the old offline banner happened to carry `text-warm`; removing that
     class (recoloring the banner crimson, below) silently broke every
     other var(--color-warm) reference app-wide -- sun icon, hot-threshold
     bars, sparkline gradient, sun arc. Restating the palette here, as plain
     CSS the browser parses unconditionally, decouples every var() consumer
     (this stylesheet and app.js) from Tailwind's scanner entirely. @theme
     keeps its own copy so text-accent/text-crimson/bg-crimson etc. still
     generate -- the two are intentionally redundant. */
  :root{
    --color-ink:      oklch(0.96 0.01 250);
    --color-muted:    oklch(0.70 0.03 255);
    --color-faint:    oklch(0.52 0.03 258);
    --color-panel:    oklch(0.19 0.015 260 / 0.88);
    --color-hairline: oklch(0.70 0.04 260 / 0.14);
    --color-accent:        #2be4ea;
    --color-warm:          #fed33f;
    --color-crimson:       #e8615a;
    --color-cyan-border:   #1f6a6e;
    --color-amber-border:  #8a6a12;
    --color-crimson-border:#9c3230;
    --color-online:        #2bfea0;
    /* Safe-area insets so panels don't render under the user's own
       top/bottom bars. Real values come from config.json's
       display.safe_area_* (applied in app.js's apply()); these are just
       the pre-first-paint fallback. */
    --safe-top:    0px;
    --safe-bottom: 0px;
  }

  html,body{height:100%;margin:0;overflow:hidden}
  body{
    color:var(--color-ink);
    font-family:"Fira Sans",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(55% 48% at 30% 8%,  rgb(70 22 22 / .45), transparent 72%),
      radial-gradient(120% 90% at 12% 0%,  oklch(0.32 0.09 265 / .55), transparent 62%),
      radial-gradient(100% 80% at 92% 8%,  oklch(0.34 0.10 200 / .40), transparent 58%),
      radial-gradient(90%  90% at 60% 108%,oklch(0.30 0.08 300 / .38), transparent 60%),
      linear-gradient(160deg, oklch(0.16 0.03 265), oklch(0.11 0.02 255) 55%, oklch(0.13 0.03 240));
  }
  /* Transparent mode: let cosmic-bg's photo wallpaper show through. */
  body.transparent{background:transparent}
  body.transparent .panel{backdrop-filter:blur(18px) saturate(1.3)}
  body.transparent .glow{display:none}

  /* Cyberpunk UIKit accent triad -- any element opts in with one of these
     classes; .panel/.sec-head/.glowtext/.dot read the accent back via the
     --panel-accent/--panel-border custom props they set. Mixed accents can
     coexist on one page, same as the template's per-component `accent` prop. */
  .accent-cyan   {--panel-accent:var(--color-accent);  --panel-border:var(--color-cyan-border)}
  .accent-amber  {--panel-accent:var(--color-warm);    --panel-border:var(--color-amber-border)}
  .accent-crimson{--panel-accent:var(--color-crimson); --panel-border:var(--color-crimson-border)}

  /* Notched cut-corner card, ported from CyberpunkUIKit's CyberpunkPad --
     solid dark fill, 2px accent-colored border, diagonal corner cut with a
     glowing tab in the notch. */
  .panel{
    position:relative;
    background:var(--color-panel);
    border:2px solid var(--panel-border, var(--color-hairline));
    clip-path:polygon(0 0,100% 0,100% calc(100% - 1.15rem),calc(100% - 1.15rem) 100%,0 100%);
    backdrop-filter:blur(6px);
  }
  .panel::after{
    content:"";
    position:absolute;right:-2px;bottom:0.62rem;
    width:1.55rem;height:3px;
    background:var(--panel-accent, var(--color-accent));
    box-shadow:0 0 6px var(--panel-accent, var(--color-accent));
    transform:rotate(-45deg);transform-origin:right center;
    pointer-events:none;
  }
  body.transparent .panel::after{box-shadow:none}

  /* Section headers: glowing accent underline, ported from
     CyberpunkSectionHeader's after: rule. */
  .sec-head{position:relative;padding-bottom:0.65vmin}
  .sec-head::after{
    content:"";position:absolute;left:0;bottom:0;width:100%;height:1px;
    background:var(--panel-accent, var(--color-accent));
    box-shadow:0 0 6px var(--panel-accent, var(--color-accent));
  }

  /* Glow text, ported from CyberpunkGlowText -- reserved for the two
     headline readouts (clock, temperature) so it reads as emphasis, not
     noise. */
  .glowtext{text-shadow:-6px -4px 26px var(--panel-accent, var(--color-accent))}

  /* Status dot, ported from CyberpunkStatusDot. */
  .dot{display:inline-block;width:0.55em;height:0.55em;border-radius:50%;
       vertical-align:middle;margin-right:0.6em;flex:none}

  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  /* System table: icon | label | value | histograph/badge, one row per
     metric, so everything lines up in real table columns instead of
     independently-sized flex rows. */
  .sys-table td{vertical-align:middle;padding:0.32vmin 0}
  .sys-table .sysicon{width:1.05em;height:1.05em;display:block}

  /* Utilization ring around the CPU/MEM/BAT icons: a fixed deep-red base
     disc (::before) plus a second same-size disc (.icon-ring__fill) that
     grows from the center and glows brighter as a metric's percentage
     approaches 100 -- reads as a status light powering up, not a progress
     bar. Continuous fill is driven by --ring-scale (0-1, set inline per
     row in app.js's iconRing()); battery instead uses one of the
     .icon-ring--batt-* modifiers below, since "charging" is a discrete
     state a fill level can't express (replaces the old CHRG text badge --
     the ring now carries that same signal). */
  .icon-ring{position:relative;width:1.6em;height:1.6em;border-radius:50%;
    display:grid;place-items:center;flex:none}
  .icon-ring::before{content:"";position:absolute;inset:0;border-radius:50%;
    background:oklch(0.15 0.03 25)}
  .icon-ring__fill{
    position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 42% 34%,
      oklch(0.85 0.08 25) 0%, var(--color-crimson) 55%, oklch(0.30 0.07 25) 100%);
    transform:scale(var(--ring-scale,0));
    box-shadow:0 0 calc(2px + var(--ring-scale,0) * 9px)
               calc(var(--ring-scale,0) * 3px) var(--color-crimson);
    transition:transform .6s ease,box-shadow .6s ease,opacity .4s ease;
  }
  .icon-ring .sysicon{position:relative;z-index:1;width:0.95em;height:0.95em}

  .icon-ring--batt-charging .icon-ring__fill{--ring-scale:1}
  .icon-ring--batt-dim .icon-ring__fill{--ring-scale:0.22;opacity:.55;box-shadow:none}
  .icon-ring--batt-low .icon-ring__fill{--ring-scale:1;animation:ring-flash 2s steps(1) infinite}
  @keyframes ring-flash{0%,49.99%{opacity:1}50%,100%{opacity:.12}}
  @media (prefers-reduced-motion:reduce){
    .icon-ring--batt-low .icon-ring__fill{animation:none;opacity:.7}
  }

  /* slow drifting light so a static desktop still feels alive --
     crimson/cyan, matching CyberpunkEnvironment's reddish ambient glow */
  .glow{position:fixed;border-radius:50%;filter:blur(110px);pointer-events:none;z-index:-1}
  .g1{width:44vw;height:44vw;top:-16vw;left:-8vw;
      background:oklch(0.55 0.17 25/.30);animation:d1 42s ease-in-out infinite alternate}
  .g2{width:38vw;height:38vw;bottom:-16vw;right:-6vw;
      background:oklch(0.58 0.15 195/.26);animation:d2 55s ease-in-out infinite alternate}
  @keyframes d1{to{transform:translate(9vw,7vw) scale(1.18)}}
  @keyframes d2{to{transform:translate(-8vw,-6vw) scale(1.22)}}
  @media (prefers-reduced-motion:reduce){.glow{animation:none}}

  .fadein{animation:fi .6s ease both}
  @keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  #boot{position:fixed;inset:0;display:grid;place-items:center;
        background:oklch(0.12 0.02 255);z-index:50;transition:opacity .5s}
</style>
</head>

<body class="h-full">
  <div class="glow g1"></div><div class="glow g2"></div>

  <div id="boot"><div class="glowtext text-faint text-2xl tracking-widest">STARTING…</div></div>

  <!-- offline / server-down banner -->
  <div id="offline" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-40
       accent-crimson panel px-5 py-2 text-crimson text-sm tracking-wide">
    <span class="dot bg-crimson"></span>data feed unreachable — showing last known values
  </div>

  <!-- No date/clock/location readout -- the user's system already shows
       all three (see ISSUES.md #5, #9). Two halves: System | Forecast. -->
  <main id="root" class="h-full w-full px-[2.2vmin] gap-[1.8vmin]
        pt-[calc(2.2vmin+var(--safe-top))] pb-[calc(2.2vmin+var(--safe-bottom))]
        grid grid-cols-1 lg:grid-cols-2 grid-rows-1">

    <!-- ============ LEFT HALF: system ============ -->
    <section class="accent-cyan flex flex-col min-h-0">
      <div class="panel px-[2vmin] py-[1.5vmin] flex flex-col gap-[0.6vmin]">
        <h2 class="sec-head text-faint uppercase tracking-[0.3em] text-[clamp(.55rem,1.15vmin,.8rem)]">
          System</h2>
        <!-- CPU, Memory, Battery -- table so icon / label / value / chart
             line up across every row. Each metric is one value row plus a
             step-line-chart row per time tier (see ISSUES.md #12); Battery
             sits directly under Memory. -->
        <table class="sys-table w-full border-collapse">
          <colgroup>
            <col class="w-[1.7em]"><col><col class="w-[24%]"><col class="w-[36%]">
          </colgroup>
          <tbody id="sys"></tbody>
        </table>

        <!-- Storage: its own visually separated area, not mixed into the
             cpu/mem/bat metric rows above. -->
        <div class="pt-[0.6vmin] border-t border-[var(--color-hairline)]">
          <h3 class="sec-head text-faint uppercase tracking-[0.3em]
              text-[clamp(.48rem,1vmin,.68rem)] mb-[0.35vmin]">Storage</h3>
          <table class="sys-table w-full border-collapse">
            <colgroup>
              <col class="w-[1.7em]"><col><col class="w-[24%]"><col class="w-[36%]">
            </colgroup>
            <tbody id="disks"></tbody>
          </table>
        </div>

        <!-- Network: its own dedicated area below Storage, one row with a
             dual-line (down/up) step chart. -->
        <div class="pt-[0.6vmin] border-t border-[var(--color-hairline)]">
          <h3 class="sec-head text-faint uppercase tracking-[0.3em]
              text-[clamp(.48rem,1vmin,.68rem)] mb-[0.35vmin]">Network</h3>
          <table class="sys-table w-full border-collapse">
            <colgroup>
              <col class="w-[1.7em]"><col><col class="w-[24%]"><col class="w-[36%]">
            </colgroup>
            <tbody id="net"></tbody>
          </table>
        </div>

        <div id="sysfoot" class="text-faint num tracking-wide
             text-[clamp(.46rem,.95vmin,.68rem)] pt-[0.55vmin]
             border-t border-[var(--color-hairline)]">—</div>
      </div>
    </section>

    <!-- ============ RIGHT HALF: forecast -- current, hourly, week, sun/moon ============ -->
    <section class="accent-amber flex flex-col min-h-0">
      <div class="panel px-[2.4vmin] py-[1.8vmin] flex flex-col gap-[1.3vmin]">
        <div class="flex items-center gap-[2vmin]">
          <div id="wicon" class="shrink-0 w-[clamp(2.8rem,8vmin,6.5rem)]
               h-[clamp(2.8rem,8vmin,6.5rem)]"></div>
          <div class="min-w-0">
            <div class="flex items-start">
              <span id="temp" class="glowtext num font-thin leading-[0.85] tracking-[-0.04em]
                    text-[clamp(2.4rem,8vmin,6.5rem)]">--</span>
              <span id="tempunit" class="text-muted font-light mt-[1vmin]
                    text-[clamp(.9rem,2.4vmin,1.8rem)]">°</span>
            </div>
            <div id="wdesc" class="text-ink/90 mt-[0.4vmin]
                 text-[clamp(.8rem,2vmin,1.5rem)] font-light truncate">—</div>
            <div id="wfeels" class="text-faint text-[clamp(.58rem,1.25vmin,.9rem)]
                 tracking-wide mt-[0.3vmin]">—</div>
          </div>
        </div>
        <div id="wstats" class="grid grid-cols-4 gap-[1vmin] pt-[1.1vmin]
             border-t border-[var(--color-hairline)]"></div>

        <div class="pt-[1.1vmin] border-t border-[var(--color-hairline)]">
          <h3 class="sec-head text-faint uppercase tracking-[0.3em]
              text-[clamp(.5rem,1.05vmin,.72rem)] mb-[0.6vmin]">Hourly</h3>
          <div id="hourly" class="flex justify-between gap-[0.4vmin]"></div>
        </div>

        <div class="pt-[1.1vmin] border-t border-[var(--color-hairline)]">
          <h3 class="sec-head text-faint uppercase tracking-[0.3em]
              text-[clamp(.5rem,1.05vmin,.72rem)] mb-[0.4vmin]">Week</h3>
          <div id="week" class="flex flex-col"></div>
        </div>

        <div class="pt-[1.1vmin] border-t border-[var(--color-hairline)]">
          <h3 class="sec-head text-faint uppercase tracking-[0.3em]
              text-[clamp(.5rem,1.05vmin,.72rem)] mb-[0.7vmin]">Sun &amp; Moon</h3>
          <svg id="sunarc" viewBox="0 0 300 96" class="w-full"></svg>
          <div class="flex items-center justify-between mt-[0.9vmin]">
            <div id="suntimes" class="num text-muted
                 text-[clamp(.56rem,1.2vmin,.88rem)] tracking-wide"></div>
            <div class="flex items-center gap-[1vmin]">
              <svg id="moon" viewBox="0 0 100 100"
                   class="w-[clamp(1.3rem,3.4vmin,2.3rem)] h-[clamp(1.3rem,3.4vmin,2.3rem)]"></svg>
              <div id="moontext" class="text-faint leading-tight
                   text-[clamp(.5rem,1.05vmin,.76rem)]"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
