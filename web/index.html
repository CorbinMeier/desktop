<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<title>Desktop Dashboard</title>
<script src="vendor/tailwind.js"></script>
<style type="text/tailwindcss">
  @theme {
    --font-sans: "Fira Sans", system-ui, sans-serif;
    --font-mono: "Fira Mono", ui-monospace, monospace;
    --color-ink:      oklch(0.96 0.01 250);
    --color-muted:    oklch(0.70 0.03 255);
    --color-faint:    oklch(0.52 0.03 258);
    --color-accent:   oklch(0.80 0.12 195);
    --color-warm:     oklch(0.80 0.13  65);
    --color-panel:    oklch(0.22 0.02 260 / 0.42);
    --color-hairline: oklch(0.70 0.04 260 / 0.14);
  }
</style>
<style>
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    color:var(--color-ink);
    font-family:"Fira Sans",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(120% 90% at 12% 0%,  oklch(0.32 0.09 265 / .55), transparent 62%),
      radial-gradient(100% 80% at 92% 8%,  oklch(0.34 0.10 200 / .40), transparent 58%),
      radial-gradient(90%  90% at 60% 108%,oklch(0.30 0.08 300 / .38), transparent 60%),
      linear-gradient(160deg, oklch(0.16 0.03 265), oklch(0.11 0.02 255) 55%, oklch(0.13 0.03 240));
  }
  /* Transparent mode: let cosmic-bg's photo wallpaper show through. */
  body.transparent{background:transparent}
  body.transparent .panel{backdrop-filter:blur(18px) saturate(1.3)}
  body.transparent .glow{display:none}

  .panel{
    background:var(--color-panel);
    border:1px solid var(--color-hairline);
    border-radius:1.15rem;
    backdrop-filter:blur(9px);
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  /* slow drifting light so a static desktop still feels alive */
  .glow{position:fixed;border-radius:50%;filter:blur(110px);pointer-events:none;z-index:-1}
  .g1{width:44vw;height:44vw;top:-16vw;left:-8vw;
      background:oklch(0.55 0.17 255/.30);animation:d1 42s ease-in-out infinite alternate}
  .g2{width:38vw;height:38vw;bottom:-16vw;right:-6vw;
      background:oklch(0.58 0.15 195/.26);animation:d2 55s ease-in-out infinite alternate}
  @keyframes d1{to{transform:translate(9vw,7vw) scale(1.18)}}
  @keyframes d2{to{transform:translate(-8vw,-6vw) scale(1.22)}}
  @media (prefers-reduced-motion:reduce){.glow{animation:none}}

  .fadein{animation:fi .6s ease both}
  @keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  #boot{position:fixed;inset:0;display:grid;place-items:center;
        background:oklch(0.12 0.02 255);z-index:50;transition:opacity .5s}
</style>
</head>

<body class="h-full">
  <div class="glow g1"></div><div class="glow g2"></div>

  <div id="boot"><div class="text-faint text-2xl tracking-widest">STARTING…</div></div>

  <!-- offline / server-down banner -->
  <div id="offline" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-40
       panel px-5 py-2 text-warm text-sm tracking-wide">
    data feed unreachable — showing last known values
  </div>

  <main id="root" class="h-full w-full p-[2.2vmin] gap-[1.8vmin]
        grid grid-cols-1 lg:grid-cols-[1.05fr_1.35fr_1fr] grid-rows-1">

    <!-- ============ LEFT: clock + system ============ -->
    <section class="flex flex-col gap-[1.8vmin] min-h-0">
      <div class="panel px-[2.4vmin] py-[2.2vmin] flex flex-col justify-center">
        <div id="clock" class="num font-extralight leading-[0.86] tracking-[-0.045em]
             text-[clamp(3.5rem,11.5vmin,10rem)]">--:--</div>
        <div id="seconds" class="num text-accent text-[clamp(.8rem,1.9vmin,1.5rem)]
             tracking-[0.18em] mt-[0.9vmin]">--</div>
        <div id="date" class="text-muted uppercase tracking-[0.3em]
             text-[clamp(.65rem,1.55vmin,1.1rem)] mt-[1.1vmin]">—</div>
        <div id="loc" class="text-faint tracking-[0.22em]
             text-[clamp(.6rem,1.3vmin,.95rem)] mt-[0.5vmin]">—</div>
      </div>

      <div class="panel px-[2.2vmin] py-[2vmin] flex-1 min-h-0 flex flex-col gap-[1.4vmin]">
        <h2 class="text-faint uppercase tracking-[0.3em] text-[clamp(.55rem,1.15vmin,.8rem)]">
          System</h2>
        <div id="sys" class="flex flex-col gap-[1.15vmin] flex-1 justify-evenly"></div>
        <div id="sysfoot" class="text-faint num tracking-wide
             text-[clamp(.55rem,1.15vmin,.82rem)] pt-[1vmin]
             border-t border-[var(--color-hairline)]">—</div>
      </div>
    </section>

    <!-- ============ CENTER: weather ============ -->
    <section class="flex flex-col gap-[1.8vmin] min-h-0">
      <div class="panel px-[2.6vmin] py-[2.2vmin] flex flex-col justify-center">
        <div class="flex items-center gap-[2.4vmin]">
          <div id="wicon" class="shrink-0 w-[clamp(3.5rem,11vmin,9rem)]
               h-[clamp(3.5rem,11vmin,9rem)]"></div>
          <div class="min-w-0">
            <div class="flex items-start">
              <span id="temp" class="num font-thin leading-[0.85] tracking-[-0.04em]
                    text-[clamp(3rem,11vmin,9.5rem)]">--</span>
              <span id="tempunit" class="text-muted font-light mt-[1.2vmin]
                    text-[clamp(1rem,3vmin,2.4rem)]">°</span>
            </div>
            <div id="wdesc" class="text-ink/90 mt-[0.6vmin]
                 text-[clamp(.9rem,2.5vmin,2rem)] font-light truncate">—</div>
            <div id="wfeels" class="text-faint text-[clamp(.62rem,1.4vmin,1rem)]
                 tracking-wide mt-[0.35vmin]">—</div>
          </div>
        </div>
        <div id="wstats" class="grid grid-cols-4 gap-[1.2vmin] mt-[2vmin]
             pt-[1.6vmin] border-t border-[var(--color-hairline)]"></div>
      </div>

      <div class="panel px-[2.2vmin] py-[2vmin] flex-1 min-h-0 flex flex-col">
        <h2 class="text-faint uppercase tracking-[0.3em]
            text-[clamp(.55rem,1.15vmin,.8rem)] mb-[1vmin]">Next 24 hours</h2>
        <!-- viewBox is set from the measured pixel size at render time, so
             1 unit == 1 px. Using preserveAspectRatio="none" here instead
             would stretch the labels and squash the markers into ellipses. -->
        <div class="flex-1 min-h-0"><svg id="spark" class="w-full h-full"></svg></div>
        <div id="hourlabels" class="flex justify-between text-faint num
             text-[clamp(.5rem,1.1vmin,.8rem)] mt-[0.8vmin]"></div>
      </div>
    </section>

    <!-- ============ RIGHT: forecast + sun/moon ============ -->
    <section class="flex flex-col gap-[1.8vmin] min-h-0">
      <div class="panel px-[2.2vmin] py-[2vmin] flex-1 min-h-0 flex flex-col">
        <h2 class="text-faint uppercase tracking-[0.3em]
            text-[clamp(.55rem,1.15vmin,.8rem)] mb-[1.2vmin]">Week</h2>
        <div id="week" class="flex flex-col justify-around flex-1 min-h-0"></div>
      </div>

      <div class="panel px-[2.2vmin] py-[2vmin]">
        <h2 class="text-faint uppercase tracking-[0.3em]
            text-[clamp(.55rem,1.15vmin,.8rem)] mb-[1vmin]">Sun &amp; Moon</h2>
        <svg id="sunarc" viewBox="0 0 300 96" class="w-full"></svg>
        <div class="flex items-center justify-between mt-[1.2vmin]">
          <div id="suntimes" class="num text-muted
               text-[clamp(.6rem,1.35vmin,1rem)] tracking-wide"></div>
          <div class="flex items-center gap-[1.2vmin]">
            <svg id="moon" viewBox="0 0 100 100"
                 class="w-[clamp(1.6rem,4.2vmin,3rem)] h-[clamp(1.6rem,4.2vmin,3rem)]"></svg>
            <div id="moontext" class="text-faint leading-tight
                 text-[clamp(.55rem,1.2vmin,.85rem)]"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
