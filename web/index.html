<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<title>Desktop Dashboard</title>
<script src="vendor/tailwind.js"></script>
<style type="text/tailwindcss">
  @theme {
    --font-sans: "Fira Sans", system-ui, sans-serif;
    --font-mono: "Fira Mono", ui-monospace, monospace;
    --color-ink:      oklch(0.96 0.01 250);
    --color-muted:    oklch(0.70 0.03 255);
    --color-faint:    oklch(0.52 0.03 258);
    --color-panel:    oklch(0.19 0.015 260 / 0.88);
    --color-hairline: oklch(0.70 0.04 260 / 0.14);
    /* Cyberpunk UIKit accent triad (ui/cyberpunk/CyberpunkUIKit) -- exact
       hex values from the template so the two stay in visual sync. */
    --color-accent:        #2be4ea;  /* cyan   */
    --color-warm:          #fed33f;  /* amber  */
    --color-crimson:       #e8615a;
    --color-cyan-border:   #1f6a6e;
    --color-amber-border:  #8a6a12;
    --color-crimson-border:#9c3230;
    --color-online:        #2bfea0;
  }
</style>
<style>
  /* Tailwind's browser JIT only emits an @theme token onto :root when its
     scanner sees the token's name inside an HTML class attribute (a plain
     utility like `text-warm`, or the var() spelled out in `[...]`
     arbitrary-value syntax) -- never for a var() reference buried in this
     <style> tag or in app.js. --color-warm used to be emitted only because
     the old offline banner happened to carry `text-warm`; removing that
     class (recoloring the banner crimson, below) silently broke every
     other var(--color-warm) reference app-wide -- sun icon, hot-threshold
     bars, sparkline gradient, sun arc. Restating the palette here, as plain
     CSS the browser parses unconditionally, decouples every var() consumer
     (this stylesheet and app.js) from Tailwind's scanner entirely. @theme
     keeps its own copy so text-accent/text-crimson/bg-crimson etc. still
     generate -- the two are intentionally redundant. */
  :root{
    --color-ink:      oklch(0.96 0.01 250);
    --color-muted:    oklch(0.70 0.03 255);
    --color-faint:    oklch(0.52 0.03 258);
    --color-panel:    oklch(0.19 0.015 260 / 0.88);
    --color-hairline: oklch(0.70 0.04 260 / 0.14);
    --color-accent:        #2be4ea;
    --color-warm:          #fed33f;
    --color-crimson:       #e8615a;
    --color-cyan-border:   #1f6a6e;
    --color-amber-border:  #8a6a12;
    --color-crimson-border:#9c3230;
    --color-online:        #2bfea0;
    /* Panel-chrome-only crimson (border/underline for .accent-crimson,
       e.g. Devices/Log): separate from --color-crimson/-border above,
       which stay semantic red for alert states (offline banner, offline
       device dot, critical log status) even under Retro Terminal -- #38
       asked for the panel chrome to go green, not for alerts to lose
       their signal color. Same values as --color-crimson by default, so
       night_ops looks unchanged. */
    --color-crimson-panel:        #e8615a;
    --color-crimson-panel-border: #9c3230;
    /* Per-device offline dot (statusDot() in app.js) -- separate from
       --color-crimson so a theme can dim it instead of recoloring it
       (#44): night_ops keeps the same red as every other alert, but
       Retro Terminal wants "off" read as a dim green next to "up"'s
       bright green, not a hue change. */
    --color-offline-dot: #e8615a;
    /* CPU/MEM/BAT utilization-bar spectrum (#31's angled-bar graphic,
       app.js's spectrumColor()) -- read via getComputedStyle rather than
       hardcoded in JS so a theme can override them like every other
       color here (#39). red -> gold -> green by default. */
    --spectrum-lo:  #e8615a;
    --spectrum-mid: #fed33f;
    --spectrum-hi:  #2bfea0;
    /* Safe-area insets so panels don't render under the user's own
       top/bottom bars. Real values come from config.json's
       display.safe_area_* (applied in app.js's apply()); these are just
       the pre-first-paint fallback. */
    --safe-top:    0px;
    --safe-bottom: 0px;

    /* Rendering layers (#32): a fixed z-order stack every component picks
       one slot from, instead of ad-hoc z-index values scattered per
       element. bg sits behind the panels (ambient glow blobs today); fx
       sits above panel content but below the offline banner/boot overlay
       -- built for the Retro Terminal CRT overlay (scanlines/vignette/
       flicker), but themeless: any future effect that needs to sit above
       content without being part of it uses this same slot. */
    --z-bg: -1;
    --z-content: 0;
    --z-fx: 30;
    --z-banner: 40;
    --z-boot: 50;
  }

  /* ---------------------------------------------------------------- theme
     Theme toggle surface (#32): a config.json `display.theme` field,
     applied by app.js's apply() as data-theme on <html>. Three themes ship:
     "night_ops" (default, no override needed -- it's the base palette
     above), "retro_terminal" (CRT/green-phosphor), and "retro_orange" (#45,
     the same CRT treatment in amber phosphor). A theme overrides only the
     CSS custom properties every component already reads through
     (--color-*, --panel-accent/--panel-border via .accent-*) -- component
     shape/markup never branches on theme, so a new theme is a palette +
     fx-layer addition, not a parallel set of components. */
  html[data-theme="retro_terminal"]{
    --color-ink:      #b9ffce;
    --color-muted:    #6fe39a;
    --color-faint:    #3f8f63;
    --color-panel:    oklch(0.09 0.03 150 / 0.92);
    --color-hairline: oklch(0.55 0.10 150 / 0.22);
    /* Monochrome phosphor: accent/warm/crimson all converge on the same
       green so accent-cyan/amber/crimson panels (System/Forecast/offline)
       read as one consistent CRT palette without touching the class
       assignments in index.html or app.js. */
    --color-accent:         #39ff88;
    --color-warm:           #39ff88;
    --color-crimson:        #ff5f4d;
    --color-cyan-border:    #1c6b3f;
    --color-amber-border:   #1c6b3f;
    --color-crimson-border: #7a2a1f;
    --color-online:         #39ff88;
    /* #38: Devices/Log panel chrome (border/underline) converges on the
       same green as every other panel; --color-crimson/-border above
       stay red so alert states (offline banner/dot, critical log) still
       stand out on the phosphor screen. */
    --color-crimson-panel:        #39ff88;
    --color-crimson-panel-border: #1c6b3f;
    /* #44: offline devices read as a dim green dot next to "up"'s bright
       --color-online, instead of switching to red. */
    --color-offline-dot: #1c6b3f;
    /* #39: CPU/MEM/BAT utilization bars go all-green too -- graduated
       dim -> bright phosphor instead of the red/gold/green spectrum. */
    --spectrum-lo:  #145c33;
    --spectrum-mid: #21a35c;
    --spectrum-hi:  #39ff88;
  }
  html[data-theme="retro_terminal"] body{
    font-family:"Fira Mono",ui-monospace,monospace;
    background:#040a06;
  }
  html[data-theme="retro_terminal"] body.transparent{background:transparent}
  /* CRT is flat and monochrome -- the cyberpunk ambient glow blobs and
     panel blur belong to the Night Ops palette, not this one. */
  html[data-theme="retro_terminal"] .glow{display:none}
  html[data-theme="retro_terminal"] .panel{backdrop-filter:none}

  /* retro_orange (#45): same CRT/phosphor treatment as retro_terminal,
     amber hue instead of green -- mirrors its structure line for line so
     the two stay in sync if the CRT mechanic ever changes. */
  html[data-theme="retro_orange"]{
    --color-ink:      #ffdcae;
    --color-muted:    #e3a35a;
    --color-faint:    #8f5f2e;
    --color-panel:    oklch(0.10 0.03 55 / 0.92);
    --color-hairline: oklch(0.55 0.10 55 / 0.22);
    /* Monochrome phosphor: accent/warm/crimson all converge on the same
       amber so accent-cyan/amber/crimson panels (System/Forecast/offline)
       read as one consistent CRT palette without touching the class
       assignments in index.html or app.js. */
    --color-accent:         #ff9a2e;
    --color-warm:           #ff9a2e;
    --color-crimson:        #ff5f4d;
    --color-cyan-border:    #8a4f14;
    --color-amber-border:   #8a4f14;
    --color-crimson-border: #7a2a1f;
    --color-online:         #ff9a2e;
    /* Devices/Log panel chrome (border/underline) converges on the same
       amber as every other panel; --color-crimson/-border above stay red
       so alert states (offline banner/dot, critical log) still stand out
       on the phosphor screen. */
    --color-crimson-panel:        #ff9a2e;
    --color-crimson-panel-border: #8a4f14;
    /* Offline devices read as a dim amber dot next to "up"'s bright
       --color-online, instead of switching to red. */
    --color-offline-dot: #8a4f14;
    /* CPU/MEM/BAT utilization bars go all-amber too -- graduated dim ->
       bright phosphor instead of the red/gold/green spectrum. */
    --spectrum-lo:  #5c3210;
    --spectrum-mid: #c4741e;
    --spectrum-hi:  #ff9a2e;
  }
  html[data-theme="retro_orange"] body{
    font-family:"Fira Mono",ui-monospace,monospace;
    background:#0a0503;
  }
  html[data-theme="retro_orange"] body.transparent{background:transparent}
  html[data-theme="retro_orange"] .glow{display:none}
  html[data-theme="retro_orange"] .panel{backdrop-filter:none}

  html,body{height:100%;margin:0;overflow:hidden}
  body{
    color:var(--color-ink);
    font-family:"Fira Sans",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(55% 48% at 30% 8%,  rgb(70 22 22 / .45), transparent 72%),
      radial-gradient(120% 90% at 12% 0%,  oklch(0.32 0.09 265 / .55), transparent 62%),
      radial-gradient(100% 80% at 92% 8%,  oklch(0.34 0.10 200 / .40), transparent 58%),
      radial-gradient(90%  90% at 60% 108%,oklch(0.30 0.08 300 / .38), transparent 60%),
      linear-gradient(160deg, oklch(0.16 0.03 265), oklch(0.11 0.02 255) 55%, oklch(0.13 0.03 240));
  }
  /* Transparent mode: let cosmic-bg's photo wallpaper show through. */
  body.transparent{background:transparent}
  body.transparent .panel{backdrop-filter:blur(18px) saturate(1.3)}
  body.transparent .glow{display:none}

  /* Cyberpunk UIKit accent triad -- any element opts in with one of these
     classes; .panel/.sec-head/.glowtext/.dot read the accent back via the
     --panel-accent/--panel-border custom props they set. Mixed accents can
     coexist on one page, same as the template's per-component `accent` prop. */
  .accent-cyan   {--panel-accent:var(--color-accent);  --panel-border:var(--color-cyan-border)}
  .accent-amber  {--panel-accent:var(--color-warm);    --panel-border:var(--color-amber-border)}
  .accent-crimson{--panel-accent:var(--color-crimson-panel); --panel-border:var(--color-crimson-panel-border)}
  /* True-red alert accent (#46 weather highlight): unlike .accent-crimson
     above (--color-crimson-panel, which themes recolor for Devices/Log's
     panel identity -- green under retro_terminal, orange under
     retro_orange), this reads --color-crimson/-border directly, which every
     theme keeps genuinely red for actual alert states (offline banner,
     critical log status, offline device dot). Always red regardless of
     theme is the point, so a real weather alert can't blend into a theme's
     palette. */
  .accent-alert{--panel-accent:var(--color-crimson); --panel-border:var(--color-crimson-border)}

  /* Notched cut-corner card, ported from CyberpunkUIKit's CyberpunkPad --
     solid dark fill, 2px accent-colored border, diagonal corner cut with a
     glowing tab in the notch. */
  .panel{
    position:relative;
    background:var(--color-panel);
    border:2px solid var(--panel-border, var(--color-hairline));
    clip-path:polygon(0 0,100% 0,100% calc(100% - 1.15rem),calc(100% - 1.15rem) 100%,0 100%);
    backdrop-filter:blur(6px);
  }
  .panel::after{
    content:"";
    position:absolute;right:-2px;bottom:0.62rem;
    width:1.55rem;height:3px;
    background:var(--panel-accent, var(--color-accent));
    box-shadow:0 0 6px var(--panel-accent, var(--color-accent));
    transform:rotate(-45deg);transform-origin:right center;
    pointer-events:none;
  }
  body.transparent .panel::after{box-shadow:none}

  /* Section headers: glowing accent underline, ported from
     CyberpunkSectionHeader's after: rule. */
  .sec-head{position:relative;padding-bottom:0.65vmin}
  .sec-head::after{
    content:"";position:absolute;left:0;bottom:0;width:100%;height:1px;
    background:var(--panel-accent, var(--color-accent));
    box-shadow:0 0 6px var(--panel-accent, var(--color-accent));
  }

  /* Glow text, ported from CyberpunkGlowText -- reserved for the two
     headline readouts (clock, temperature) so it reads as emphasis, not
     noise. */
  .glowtext{text-shadow:-6px -4px 26px var(--panel-accent, var(--color-accent))}

  /* Status dot, ported from CyberpunkStatusDot. */
  .dot{display:inline-block;width:0.55em;height:0.55em;border-radius:50%;
       vertical-align:middle;margin-right:0.6em;flex:none}

  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  /* System table: icon | label | value | histograph/badge, one row per
     metric, so everything lines up in real table columns instead of
     independently-sized flex rows. width:fit-content (#33) --
     the CPU/MEM/BAT table is a direct child of .panel's flex column, so
     without this it inherits align-items:stretch and gets forced to the
     panel's full cross-axis width, which then spreads its auto-sized
     label/value/tail columns edge-to-edge. Storage/Network's tables never
     hit this because they sit one level deeper inside a plain wrapper
     <div> (the flex item), not as the table itself; harmless to apply
     here too since their natural width already equals their content. */
  .sys-table{width:fit-content}
  .sys-table td{vertical-align:middle;padding:0.32vmin 0}
  .sys-table .sysicon{width:1.05em;height:1.05em;display:block}

  /* Weather card's two-column current-conditions grid (no icons, no
     header row -- see #41). */
  .weather-grid td{padding-top:0.3vmin}
  .weather-grid td:last-child{padding-left:1.2vmin}

  /* Per-output layout (config.json outputs.<name>.layout, plumbed onto
     <html data-layout> by app.js's apply() -- #3). 'auto' (the
     default, e.g. the 1440x900 laptop) keeps #root's single stacked
     column; 'wide' (the 2560px Dell ultrawide, which has room to spare)
     switches back to the System | Forecast side-by-side split. The ID
     selector on #root outweighs Tailwind's grid-cols-1 utility class
     regardless of source order, same specificity rule as the sys-table
     td gotcha above. */
  [data-layout="wide"] #root{grid-template-columns:repeat(2, minmax(0, 1fr))}

  /* Small inline sysIcon variants for spots that aren't a sys-table row --
     the sun/moon rise/set readout and the Network row's down/up glyphs.
     Same hand-rolled-SVG philosophy as .sysicon (no emoji, no external
     assets, matches the System panel's technical/HUD line-art), just sized
     and aligned for sitting next to a text baseline instead of a table
     cell. */
  .icon-inline{width:0.9em;height:0.9em;display:inline-block;vertical-align:-0.15em}
  .icon-inline-sm{width:0.8em;height:0.8em;display:inline-block;vertical-align:-0.08em}

  /* Devices panel scan spinner (#27 follow-up) -- shown while dashd-serve's
     background nmap sweep is in flight (state.devices_scanning). A plain
     rotating ring, not another hand-rolled sysIcon glyph: every other icon
     here is a static line-art symbol, and "in progress" is motion, not a
     shape, so borrowing that language would just be a slower-reading
     static icon. transform, not a layout property, same reasoning as the
     miniBar fix elsewhere in this file. */
  .spinner{
    width:0.85em;height:0.85em;border-radius:50%;
    border:2px solid color-mix(in oklab, var(--panel-accent, var(--color-accent)) 30%, transparent);
    border-top-color:var(--panel-accent, var(--color-accent));
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Angled utilization bar (#31, replacing the retired status
     LED -- user feedback: "not working out"). A row of slanted parallelogram
     <polygon> segments built in app.js's utilBars(); this rule just gives
     the containing <svg> a small glow so the lit segments read as
     illuminated rather than flat fills, matching the reference racing-stat
     graphic's glow. */
  .util-bars polygon{transition:fill .6s ease}
  .util-bars{filter:drop-shadow(0 0 1.5px rgb(0 0 0 / .4))}

  /* slow drifting light so a static desktop still feels alive --
     crimson/cyan, matching CyberpunkEnvironment's reddish ambient glow.
     Lives on the bg layer (#32) -- behind every panel, never above content. */
  .glow{position:fixed;border-radius:50%;filter:blur(110px);pointer-events:none;z-index:var(--z-bg)}
  .g1{width:44vw;height:44vw;top:-16vw;left:-8vw;
      background:oklch(0.55 0.17 25/.30);animation:d1 42s ease-in-out infinite alternate}
  .g2{width:38vw;height:38vw;bottom:-16vw;right:-6vw;
      background:oklch(0.58 0.15 195/.26);animation:d2 55s ease-in-out infinite alternate}
  @keyframes d1{to{transform:translate(9vw,7vw) scale(1.18)}}
  @keyframes d2{to{transform:translate(-8vw,-6vw) scale(1.22)}}
  @media (prefers-reduced-motion:reduce){.glow{animation:none}}

  .fadein{animation:fi .6s ease both}
  @keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* Opt-in for any panel content that can outgrow its box (#29): give the
     element a height/max-height so it can actually overflow, add
     class="auto-cycle", and app.js's refreshAutoCycles() drives it through
     a passive scroll-dwell-reset loop -- there is no scrollbar a user could
     ever grab on this surface. No-op on an element that already fits.
     auto-cycle-x is the same mechanism on the horizontal axis (scrollLeft
     instead of scrollTop) -- Music's song-title marquee (#26 follow-up) is
     its first user: a track title too long for its clamped column scrolls
     to reveal the rest instead of just truncating silently. */
  .auto-cycle-x{overflow-x:hidden;white-space:nowrap}
  .auto-cycle{overflow-y:hidden}

  /* CRT fx layer (#32): a component-independent overlay above panel
     content (fx layer) but below the offline banner/boot. Hidden by
     default for every theme except retro_terminal -- the layer mechanism
     itself is theme-agnostic (any future effect can target it), but this
     is its one live consumer today: scanlines + a soft vignette + an
     occasional flicker, the way a real phosphor CRT never sits perfectly
     still. Never intercepts input -- same read-only surface as everything
     else in this system. */
  #crtfx{position:fixed;inset:0;display:none;pointer-events:none;z-index:var(--z-fx)}
  html[data-theme="retro_terminal"] #crtfx,
  html[data-theme="retro_orange"] #crtfx{
    display:block;
    animation:crtflicker 6.4s steps(1) infinite;
  }
  html[data-theme="retro_terminal"] #crtfx{
    background:
      repeating-linear-gradient(to bottom,
        rgb(0 0 0 / 0) 0px, rgb(0 0 0 / 0) 1px,
        rgb(0 0 0 / .22) 2px, rgb(0 0 0 / .22) 3px),
      radial-gradient(120% 100% at 50% 50%, transparent 55%, rgb(0 10 4 / .6) 100%);
  }
  /* retro_orange (#45): same scanline/vignette mechanic, vignette tinted
     warm instead of green-black so it reads as amber phosphor, not CRT
     green with a color filter slapped on top. */
  html[data-theme="retro_orange"] #crtfx{
    background:
      repeating-linear-gradient(to bottom,
        rgb(0 0 0 / 0) 0px, rgb(0 0 0 / 0) 1px,
        rgb(0 0 0 / .22) 2px, rgb(0 0 0 / .22) 3px),
      radial-gradient(120% 100% at 50% 50%, transparent 55%, rgb(10 4 0 / .6) 100%);
  }
  @keyframes crtflicker{
    0%, 94%, 100% { opacity: 1; }
    95%           { opacity: .88; }
    96%           { opacity: .98; }
    97%           { opacity: .91; }
  }
  @media (prefers-reduced-motion:reduce){#crtfx{animation:none}}

  #boot{position:fixed;inset:0;display:grid;place-items:center;
        background:oklch(0.12 0.02 255);z-index:var(--z-boot);transition:opacity .5s}
</style>
</head>

<body class="h-full">
  <div class="glow g1"></div><div class="glow g2"></div>

  <!-- fx layer (#32): theme-driven overlay effects (Retro Terminal's
       scanlines/vignette/flicker today) live here, independent of and
       above #root's panel content -- see --z-fx in the theme block above. -->
  <div id="crtfx" aria-hidden="true"></div>

  <div id="boot"><div class="glowtext text-faint text-2xl tracking-widest">STARTING…</div></div>

  <!-- offline / server-down banner -->
  <div id="offline" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-40
       accent-crimson panel px-5 py-2 text-crimson text-sm tracking-wide">
    <span class="dot bg-crimson"></span>data feed unreachable — showing last known values
  </div>

  <!-- No date/clock/location readout -- the user's system already shows
       all three (see #5, #9). Single stacked column: System above
       Forecast, both compact (justify-self-start) rather than the old
       side-by-side halves. -->
  <main id="root" class="h-full w-full px-[2.2vmin] gap-[1.8vmin]
        pt-[calc(2.2vmin+var(--safe-top))] pb-[calc(2.2vmin+var(--safe-bottom))]
        grid grid-cols-1">

    <!-- ============ TOP ROW: System (left) + Calendar/Weather/Music/Log (right) ============ -->
    <!-- col-span-full: always spans the FULL grid width as row 1, on every
         output -- not just the wide 2-col Dell layout, where row-major
         auto-placement happened to land things in the same row only by
         coincidence of DOM order. On the single-column "auto" layout
         (this laptop) that coincidence doesn't hold -- each direct grid
         child gets its own full-width row, which is what broke "top
         right" the first time this was fixed (see the right-side stack's
         own comment below for the full history). Wrapping the two
         top-level groups in their own flex row, spanning the grid
         unconditionally, makes "System top-left, everything else
         top-right" true regardless of the auto/wide toggle. items-start
         (not the grid self-start/justify-self-start pair #35 used to
         need) is the flex equivalent: without it, flex's default
         align-items:stretch would force both sides to match each other's
         height instead of each hugging its own content. -->
    <div class="col-span-full flex items-start justify-between gap-[1.8vmin]">
    <!-- System + Devices, stacked -- Devices sits directly under System
         (user request) rather than its previous fixed bottom-center
         anchor. A plain flex-col wrapper is enough here (no position:fixed
         needed): "under System" just means normal top-to-bottom DOM flow
         within System's own column of the top row, not a literal
         screen-corner position the way Log/Music/Calendar+Weather are. -->
    <div class="flex flex-col gap-[1.8vmin]">
    <section class="accent-cyan flex flex-col min-h-0">
      <div class="panel px-[2vmin] py-[1.5vmin] flex flex-col gap-[0.6vmin]">
        <h2 class="sec-head text-faint uppercase tracking-[0.3em] text-[clamp(.55rem,1.15vmin,.8rem)]">
          System</h2>
        <!-- CPU, Memory, Battery -- table so icon / label / value / utilization
             bar line up across every row (#31: the row shape now
             matches Storage/Network -- icon, label, value, tail -- since the
             leading status LED was retired). Compact, not w-full (#17) --
             sized to its own content, not stretched to fill the panel.
             The 30-minute trend graph that used to render beneath these
             rows (#17, #33) was removed (#34) -- not wanted on the
             wallpaper. Metrics collection is untouched (dashd-collect,
             metrics.db, /api/history) for possible later use. -->
        <table class="sys-table border-collapse">
          <colgroup>
            <col class="w-[1.6em]"><col><col><col>
          </colgroup>
          <tbody id="sys"></tbody>
        </table>

        <!-- Storage: its own visually separated area, not mixed into the
             cpu/mem/bat metric rows above. -->
        <div class="pt-[0.6vmin] border-t border-[var(--color-hairline)]">
          <h3 class="sec-head text-faint uppercase tracking-[0.3em]
              text-[clamp(.48rem,1vmin,.68rem)] mb-[0.35vmin]">Storage</h3>
          <table class="sys-table border-collapse">
            <colgroup>
              <col class="w-[1.7em]"><col><col><col>
            </colgroup>
            <tbody id="disks"></tbody>
          </table>
        </div>

        <!-- Network: its own dedicated area below Storage, one row with a
             dual-line (down/up) step chart. -->
        <div class="pt-[0.6vmin] border-t border-[var(--color-hairline)]">
          <h3 class="sec-head text-faint uppercase tracking-[0.3em]
              text-[clamp(.48rem,1vmin,.68rem)] mb-[0.35vmin]">Network</h3>
          <table class="sys-table border-collapse">
            <colgroup>
              <col class="w-[1.7em]"><col><col><col>
            </colgroup>
            <tbody id="net"></tbody>
          </table>
        </div>

        <div id="sysfoot" class="text-faint num tracking-wide
             text-[clamp(.46rem,.95vmin,.68rem)] pt-[0.55vmin]
             border-t border-[var(--color-hairline)]">—</div>
      </div>
    </section>

    <!-- DEVICES: networked-device presence sweep (#27), now "remembered"
         per-network (user request) -- lib/devices.py's registry is a list
         of gateways, each with a list of connected devices (user request:
         "structured data"), keyed internally by MAC (stable across DHCP/
         IP changes) and marks a previously-seen device "offline" instead
         of dropping it when a scan doesn't find it, scoped to the current
         default gateway's identity so hopping networks doesn't show a
         pile of some other network's stale devices. Was combined with Log
         under a "Monitor" heading; Log moved up front so this stood alone
         with a fixed bottom-center anchor for a while, now moved again to
         sit directly under System. Each row is status-dot | identifier |
         device name -- see statusDot()/renderDevices() in app.js, no more
         node-glyph icon. The identifier is IPv6 first (user request: "I
         want ipv6 to be the main way to identify devices"), falling back
         to IPv4 or MAC when IPv6 isn't known for that device yet; the
         name is a user-settable name_override (hand-edited into
         data/devices.json, never touched by a scan once set) first, then
         the resolved hostname -- a device with neither still gets a row
         (user request: "if there's no name, and no override, it should
         show on the devices list"). Scan target/interval are set via the
         Control Backend (#30); this just renders dashd-serve's cached
         sweep result. #devicesCount (user request) shows the device count
         in parens right after the "Devices" label. The header's right
         side shows #devicesNetwork (the current gateway's IPv6, falling
         back to IPv4 -- "which profile we're connecting to", user
         request) and #devicesSpinner (hidden by default) while
         state.devices_scanning is true -- an nmap sweep can take real
         seconds, so this is the "still working" signal instead of a panel
         that silently doesn't update for a while. -->
    <section class="accent-crimson flex flex-col">
      <div class="panel px-[2vmin] py-[1.5vmin] flex flex-col gap-[0.6vmin]">
        <h2 class="sec-head text-faint uppercase tracking-[0.3em] text-[clamp(.55rem,1.15vmin,.8rem)]
             flex items-center justify-between gap-[0.8vmin]">
          <span class="shrink-0">Devices<span id="devicesCount" class="text-faint"></span></span>
          <span class="flex items-center gap-[0.6vmin] min-w-0">
            <span id="devicesNetwork" class="normal-case tracking-normal text-faint num
                 min-w-0 truncate text-[clamp(.44rem,.92vmin,.66rem)]"></span>
            <span id="devicesSpinner" class="hidden spinner shrink-0"></span>
          </span>
        </h2>
        <!-- Clamped + auto-cycle (#29): the remembered-devices list (this
             device, the gateway, everything the registry has ever seen on
             this network, up or offline) can run well past what fits in
             the panel -- user report: "it's going off screen already".
             max-h-[22vmin] gives it a real box to overflow, auto-cycle
             (see app.js's refreshAutoCycles(), already built generically
             for exactly this and explicitly name-checked "networked
             devices" as a future user -- this is that) then passively
             scrolls through the rest over time, since there's no pointer
             on this surface to grab a scrollbar with. -->
        <div class="max-h-[22vmin] auto-cycle">
          <table class="sys-table border-collapse">
            <colgroup>
              <col class="w-[1.6em]"><col><col><col>
            </colgroup>
            <tbody id="devices"></tbody>
          </table>
        </div>
      </div>
    </section>
    </div>

    <!-- ============ RIGHT STACK: Calendar + Weather, Music, Log ============ -->
    <!-- Moved here from a fixed bottom-right anchor (user request: "keeping
         the same layout for the calendar, weather, and music, move it to
         the top right (where the log is placed)") -- this whole group is
         now a plain flex item of the top row wrapper (col-span-full
         above), the exact same "System top-left, this top-right" flex
         arrangement Log used alone before. No position:fixed needed here
         anymore: that was only ever necessary to guarantee a literal
         screen-corner position independent of sibling heights (see the
         top-row wrapper's own comment for that history), and this group
         sits in the SAME slot Log used to, via the SAME mechanism.
         flex-col order is top-to-bottom in DOM order -- Calendar+Weather's
         row first, Music second (satisfies "weather above the player"
         without hardcoding Music's height, which varies: hidden... no,
         idle-but-visible now, or one row when playing), Log last (user
         request: "move the log below the music player"). items-stretch:
         Music is meant to match the Calendar+Weather row's full width
         (user request: "expand the media player to fit the size of both
         of those components") -- align-items:stretch on an intrinsically-
         sized flex column makes every child fill the width of the widest
         one, which also keeps every child's right edge flush against the
         same left edge (originally "these should border the right side"
         when this was screen-edge-anchored; now it just means flush
         against each other, which items-stretch still gives for free). -->
    <div class="flex flex-col items-stretch gap-[1.8vmin]">

      <!-- Calendar (left) + Weather/Forecast (right). grid grid-cols-2 (not
           flex) + items-stretch: user request "expand the calendar to be
           the same size as the weather component" needs Calendar's box to
           match Weather's, in both height AND width, while Weather itself
           stays at its own natural size. items-stretch (the grid default,
           stated explicitly) handles height -- the shorter Calendar
           stretches to Weather's row height. Width needs grid specifically:
           two 1fr columns in a grid whose own width is intrinsic (this row
           isn't given an explicit width) resolve BOTH columns to the
           WIDER column's max-content size, not a forced 50/50 split of
           some externally-set width -- exactly "Calendar grows to match
           Weather," not "both meet in the middle." A plain flex row with
           flex-1 on both sides would do the latter instead, which isn't
           what was asked. -->
      <div class="grid grid-cols-2 items-stretch gap-[1.8vmin]">
        <!-- CALENDAR (#22): current-month grid. Reuses Forecast's amber
             accent (date/schedule data, same family as weather) rather
             than inventing a fourth color, same reasoning System/Devices/
             Log share teal/crimson. Source-agnostic -- optional event dots
             come from state.extra.calendar (data/extra.json, same
             pass-through pattern as everything else under "extra"), so a
             future ICS/CalDAV sync script can populate it without
             touching the server or this file. -->
        <section class="accent-amber flex flex-col">
          <!-- justify-start (not -center): the calendar grid is shorter
             than Weather's box, and centering it split the leftover space
             evenly above and below -- top-heavy dead space plus a
             bottom gap. User request: shift the content to the top of the
             box and leave the leftover space at the bottom only, since
             it's earmarked for more content later. -->
          <div class="panel px-[2vmin] py-[1.5vmin] flex flex-col justify-start
               gap-[0.6vmin] h-full">
            <h2 class="sec-head text-faint uppercase tracking-[0.3em] text-[clamp(.55rem,1.15vmin,.8rem)]">
              Calendar</h2>
            <div id="calendar" class="flex flex-col"></div>
          </div>
        </section>

        <!-- WEATHER/FORECAST: current conditions + week. accent swaps
             amber -> alert (renderWeather(), #46) when w.alert.active --
             true red (--color-crimson) regardless of theme, not
             .accent-crimson's themed --color-crimson-panel (see that
             class's comment) -- same traffic-light language as System's
             LED (critical=crimson). -->
        <section id="weather-panel" class="accent-amber flex flex-col">
          <div class="panel px-[2.4vmin] py-[1.8vmin] flex flex-col gap-[1.3vmin]">
            <!-- Weather had no header at all (user feedback: "seems like
                 the weather panel doesn't have a label") -- every other
                 panel has one, this one only lost it because "NOW" used
                 to read as enough of a heading on its own. -->
            <h2 class="sec-head text-faint uppercase tracking-[0.3em] text-[clamp(.55rem,1.15vmin,.8rem)]">
              <span>Weather</span>
            </h2>
            <!-- No icons in this card (user request). Two-column, two-row
                 grid, no header row -- "Weather"/"Feels Like" were data
                 placeholders in the user's spec (description + apparent
                 temp), not column labels. Row 1: description | feels-like
                 temp. Row 2: current temp | today's high/low. Wind/Humid/
                 Rain/UV drop the value column entirely -- one "LABEL:
                 value" line each. -->
            <table class="weather-grid border-collapse w-full">
              <colgroup><col><col></colgroup>
              <tbody>
                <tr>
                  <td id="wdesc" class="text-muted text-[clamp(.56rem,1.2vmin,.88rem)] align-top"></td>
                  <td id="wfeels" class="num text-muted text-[clamp(.56rem,1.2vmin,.88rem)] align-top"></td>
                </tr>
                <tr>
                  <td id="wtemp" class="num text-ink text-[clamp(.7rem,1.6vmin,1.05rem)] align-top"></td>
                  <td id="whilo" class="num text-muted text-[clamp(.6rem,1.3vmin,.9rem)] align-top"></td>
                </tr>
              </tbody>
            </table>
            <div id="wdetails" class="flex flex-col gap-[0.3vmin] num text-ink/90
                 text-[clamp(.56rem,1.2vmin,.88rem)] tracking-wide"></div>

            <!-- Hourly strip hidden -- user feedback: too much dead space on
                 the wallpaper. Markup/render code kept intact (renderHourly()
                 in app.js still runs, just targets a hidden node) in case it
                 comes back, same pattern as the retired CPU/MEM trend graphs
                 (#34). -->
            <div class="hidden pt-[1.1vmin] border-t border-[var(--color-hairline)]">
              <h3 class="sec-head text-faint uppercase tracking-[0.3em]
                  text-[clamp(.5rem,1.05vmin,.72rem)] mb-[0.6vmin]">Hourly</h3>
              <div id="hourly" class="flex justify-between gap-[0.4vmin]"></div>
            </div>

            <!-- Upcoming hidden -- removed from this card (user request).
                 Markup/render code kept intact (renderWeek() in app.js still
                 runs, just targets a hidden node), same pattern as Hourly/
                 Sun & Moon below. -->
            <div class="hidden pt-[1.1vmin] border-t border-[var(--color-hairline)]">
              <h3 class="sec-head text-faint uppercase tracking-[0.3em]
                  text-[clamp(.5rem,1.05vmin,.72rem)] mb-[0.4vmin]">Upcoming</h3>
              <div id="week" class="flex flex-col"></div>
            </div>

            <!-- Sun & Moon hidden -- same "too much dead space" feedback as
                 Hourly. Markup/render code kept intact (renderSunMoon() in
                 app.js still runs, just targets hidden nodes), same pattern as
                 the retired CPU/MEM trend graphs (#34). -->
            <div class="hidden pt-[1.1vmin] border-t border-[var(--color-hairline)]">
              <h3 class="sec-head text-faint uppercase tracking-[0.3em]
                  text-[clamp(.5rem,1.05vmin,.72rem)] mb-[0.7vmin]">Sun &amp; Moon</h3>
              <svg id="sunarc" viewBox="0 0 300 96" class="w-full"></svg>
              <div class="flex items-center justify-between mt-[0.9vmin]">
                <div id="suntimes" class="num text-muted flex items-center gap-[1.2vmin]
                     text-[clamp(.56rem,1.2vmin,.88rem)] tracking-wide"></div>
                <div class="flex items-center gap-[1vmin]">
                  <svg id="moon" viewBox="0 0 100 100"
                       class="w-[clamp(1.3rem,3.4vmin,2.3rem)] h-[clamp(1.3rem,3.4vmin,2.3rem)]"></svg>
                  <div id="moontext" class="text-faint leading-tight
                       text-[clamp(.5rem,1.05vmin,.76rem)]"></div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <!-- MUSIC (#26): MPRIS now-playing. Source-agnostic -- local player or
           browser tab, whatever registers over MPRIS. Hidden by default;
           renderMusic() in app.js only reveals it while something is
           actually playing/paused -- the wrapper's flex-col sizing means
           the whole stack just shrinks up when it's hidden, no gap left
           behind. No explicit width class needed to "fit the size of both
           [Calendar and Weather]" (user request) -- this section is a
           direct child of the outer items-stretch wrapper, so it's
           already stretched to the Calendar+Weather row's width (the
           widest sibling); its own .panel div then fills that via the
           section's own default (unset) align-items:stretch on its single
           flex-col child, same mechanism every other panel here already
           relies on for height. -->
      <section id="musicSection" class="accent-cyan flex flex-col">
        <div class="panel px-[2vmin] py-[1.5vmin] flex flex-col gap-[0.6vmin]">
          <h2 class="sec-head text-faint uppercase tracking-[0.3em] text-[clamp(.55rem,1.15vmin,.8rem)]">
            Music</h2>
          <!-- No sys-table, no note icon (both dropped on user request) --
               renderMusic() in app.js builds cover art (musicArt, left,
               hidden unless the player's MPRIS metadata has an art_url --
               proxied/redirected through GET /api/music/art since a
               file://-sourced art_url can't be loaded directly from this
               http-origin page) beside a two-row musicBody: title
               (clamped to the remaining space, w-0 + min-w-0 + auto-cycle-x
               so a too-long title scrolls to reveal itself instead of
               silently truncating -- w-0 is load-bearing, not just
               min-w-0: this row's own ancestors size shrink-to-fit, so a
               flex item's *intrinsic* contribution to that still uses its
               max-content size regardless of min-width/flex-basis, which
               is what let a long title stretch the whole panel before)
               left, artist/album right on row one; elapsed time | progress
               bar | total time (HH:MM:SS, .num tabular-nums so the digits
               don't jump around) on row two, square-corner bar per an
               earlier user request. When nothing is playing/paused: an idle
               placeholder, art hidden. The section itself is never hidden
               -- user report: "it should not disappear just because no
               media is playing, should just sit idle". -->
          <div id="music" class="flex gap-[0.8vmin] items-start">
            <img id="musicArt" alt=""
                 class="hidden shrink-0 object-cover"
                 style="width:clamp(2.4rem,6vmin,4.2rem);height:clamp(2.4rem,6vmin,4.2rem);
                        border:1px solid var(--panel-accent, var(--color-accent));" />
            <div id="musicBody" class="flex-1 min-w-0 flex flex-col gap-[0.5vmin]"></div>
          </div>
        </div>
      </section>

      <!-- LOG: filtered/status-colored journalctl or file tail (#28).
           Source (journalctl unit or file) + patterns are config.logs,
           editable via the Control Backend (#30). Moved below Music (user
           request) -- was the sole occupant of this top-right slot before
           Calendar/Weather/Music joined it here. shrink-0 -- this stack's
           main axis is vertical now (flex-col), so shrink-0 here means
           "don't compress Log's height to make room," same protective
           intent as before just applied to the axis that actually matters
           in this new arrangement. -->
      <section class="accent-crimson flex flex-col min-h-0 shrink-0">
        <div class="panel px-[2vmin] py-[1.5vmin] flex flex-col gap-[0.6vmin]">
          <h2 class="sec-head text-faint uppercase tracking-[0.3em] text-[clamp(.55rem,1.15vmin,.8rem)]">
            Log</h2>
          <div id="logbox" class="flex flex-col gap-[0.25vmin]
               text-[clamp(.42rem,.85vmin,.6rem)] num"></div>
        </div>
      </section>
    </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
