<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Control</title>
<style>
  :root{color-scheme:dark}
  body{font-family:system-ui,sans-serif;background:#0d1117;color:#e6edf3;
       margin:0;padding:1.2rem;max-width:32rem;margin-inline:auto}
  h1{font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase;
     color:#7ee7ea;margin-bottom:1rem}
  fieldset{border:1px solid #22303c;border-radius:8px;margin-bottom:1rem;
           padding:.8rem 1rem}
  legend{color:#9fb0bd;text-transform:uppercase;font-size:.72rem;
         letter-spacing:.08em;padding:0 .4rem}
  label{display:block;margin:.6rem 0 .25rem;font-size:.85rem;color:#c3ccd4}
  input,select{width:100%;box-sizing:border-box;background:#161b22;
               border:1px solid #30363d;color:#e6edf3;border-radius:6px;
               padding:.5rem;font-size:1rem}
  input[type=checkbox]{width:auto}
  button{margin-top:.4rem;width:100%;padding:.75rem;background:#1f6a6e;
         border:none;border-radius:6px;color:#e6edf3;font-weight:600;
         letter-spacing:.05em;font-size:1rem}
  #status{margin-top:.8rem;font-size:.85rem;color:#9fb0bd;min-height:1.2em}
</style>
</head>
<body>
  <h1>Dashboard Control</h1>
  <div id="app">Loading&hellip;</div>
  <div id="status"></div>
  <script src="control.js"></script>
</body>
</html>
